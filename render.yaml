databases:
  - name: cipher-db
    plan: free
    region: oregon

services:
  - type: web
    name: cipher-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: cipher-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSCODE
        sync: false